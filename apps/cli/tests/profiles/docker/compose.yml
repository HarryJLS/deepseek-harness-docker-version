services:
  database:
    image: oceanbase/oceanbase-ce:4.3.5-lts
    environment:
      MODE: mini
      OB_TENANT_PASSWORD: dsh-test-only
      OB_SYS_PASSWORD: dsh-test-only
    ports:
      - '127.0.0.1::2881'
    volumes:
      - database:/root/ob
      - ../../../../../deploy/schema-mysql.sql:/root/boot/init.d/00-schema.sql:ro
      - ./fixtures/database.sql:/root/boot/init.d/10-fixture.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$(obclient -h127.0.0.1 -P2881 -udsh_test@test -pdsh-test-only -Ddsh -N -s
          -e "SELECT COUNT(*) FROM dsh_kv_global WHERE app = 'archive-v0' AND unit = 'retained_settings'")" = 1
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 240s
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30
  nacos:
    image: nacos/nacos-server:v3.0.2
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: 'false'
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf -H "serverIdentity: security" http://127.0.0.1:8848/nacos/v3/admin/core/cluster/node/self']
      interval: 3s
      timeout: 3s
      retries: 100
  model:
    image: ${DSH_DOCKER_TEST_IMAGE:?Set the image built from the checkout}
    entrypoint: ['node', '/app/apps/cli/tests/profiles/docker/fixtures/model.mjs']
    volumes:
      - ./fixtures:/app/apps/cli/tests/profiles/docker/fixtures:ro
    ports:
      - '127.0.0.1::3081'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3081/control/status']
      interval: 2s
      timeout: 2s
      retries: 30
  configure:
    image: ${DSH_DOCKER_TEST_IMAGE:?Set the image built from the checkout}
    entrypoint: ['node', '/app/apps/cli/tests/profiles/docker/fixtures/configure.mjs']
    volumes:
      - ./fixtures:/app/apps/cli/tests/profiles/docker/fixtures:ro
    depends_on:
      database:
        condition: service_healthy
      nacos:
        condition: service_healthy
      model:
        condition: service_healthy
  a:
    image: ${DSH_DOCKER_TEST_IMAGE:?Set the image built from the checkout}
    command: ['--patch', '/test/verification.patch.yml']
    environment:
      DSH_NACOS_HOST: nacos
      DSH_NACOS_SETTINGS_DATA_ID: settings-a.yaml
      DSH_TELEMETRY_DISABLED: '1'
    volumes:
      - workspace:/workspace
      - attachments:/app/tmp/dsh-attachments
      - ./fixtures/verification.patch.yml:/test/verification.patch.yml:ro
    tmpfs:
      - /run:mode=0700
    ports:
      - '127.0.0.1::3080'
    depends_on:
      configure:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3080/']
      interval: 3s
      timeout: 3s
      retries: 80
  b:
    image: ${DSH_DOCKER_TEST_IMAGE:?Set the image built from the checkout}
    command: ['--patch', '/test/verification.patch.yml']
    environment:
      DSH_NACOS_HOST: nacos
      DSH_NACOS_SETTINGS_DATA_ID: settings-b.yaml
      DSH_TELEMETRY_DISABLED: '1'
    volumes:
      - workspace:/workspace
      - attachments:/app/tmp/dsh-attachments
      - ./fixtures/verification.patch.yml:/test/verification.patch.yml:ro
    tmpfs:
      - /run:mode=0700
    ports:
      - '127.0.0.1::3080'
    depends_on:
      configure:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3080/']
      interval: 3s
      timeout: 3s
      retries: 80
  proxy:
    image: nginx:1.28-alpine
    volumes:
      - ./fixtures/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1::80'
      - '127.0.0.1::81'
    depends_on:
      a:
        condition: service_healthy
      b:
        condition: service_healthy

volumes:
  database:
  workspace:
  attachments:
