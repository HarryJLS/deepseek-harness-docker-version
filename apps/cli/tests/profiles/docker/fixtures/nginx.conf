map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Test-only authenticated identities, applied to HTTP and WebSocket traffic.
map $cookie_dsh_test_user $dsh_test_user {
  default -;
  alice alice;
  bob bob;
}

server {
  listen 80;
  client_max_body_size 10m;

  location = /api/session/uploadFileBinary {
    proxy_pass http://a:3080;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-User-Id $dsh_test_user;
    add_header X-DSH-Test-Replica a always;
  }

  location / {
    proxy_pass http://b:3080;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-User-Id $dsh_test_user;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    add_header X-DSH-Test-Replica b always;
  }
}

server {
  listen 81;
  client_max_body_size 10m;
  location / {
    proxy_pass http://a:3080;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-User-Id $dsh_test_user;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    add_header X-DSH-Test-Replica a always;
  }
}
