# DeepSeek Harness — container stack.
#
# Three services: the harness, the Nacos it reads live configuration from, and
# the OceanBase (MySQL mode) it keeps durable state in. The only bind mount is
# the provisioning script the database runs once at bootstrap; every writable
# path the harness needs lives in one of the two backing services, so a
# replaced container starts clean and loses nothing.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# The harness listens on every interface inside its network namespace and
# publishes 3080. Access is open by configuration: any client that can reach
# the published port drives an agent with shell access, so publish it only
# onto a network that already answers for access.

name: dsh

services:
  oceanbase:
    image: oceanbase/oceanbase-ce:4.3.5-lts
    environment:
      # `mini` fits a single-node OceanBase onto a developer machine: a 6G
      # memory limit and 5G data and log files. It still reserves that memory
      # up front and refuses to bootstrap without it, so Docker's VM needs
      # roughly 10G for this stack — the 8G default is not enough. A production
      # cluster is not deployed this way.
      MODE: mini
      OB_TENANT_PASSWORD: dsh
      OB_SYS_PASSWORD: dsh
    ports:
      # Published for inspection from outside the compose network. The harness
      # itself reaches the database by service name and does not need this.
      - '2881:2881'
    volumes:
      - obdata:/root/ob
      # The image runs everything under this directory once the tenant is
      # bootstrapped. Mounting the DDL here models production exactly: a DBA
      # provisions the database and the harness role never issues DDL at all.
      - ./schema-mysql.sql:/root/boot/init.d/00-dsh-schema.sql:ro
    healthcheck:
      # Bootstrap takes minutes on a cold volume, and the init.d scripts run
      # after the port opens — so readiness is one of the harness's own tables
      # existing, not the server accepting connections.
      test:
        - CMD-SHELL
        - >-
          obclient -h127.0.0.1 -P2881 -uroot@test -pdsh -Ddsh
          -e 'select 1 from dsh_session limit 1'
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 300s

  nacos:
    image: nacos/nacos-server:v3.0.2
    environment:
      MODE: standalone
      # Nacos 3.x refuses to start without a Base64 token even when auth is
      # disabled, so the value is required rather than optional.
      NACOS_AUTH_ENABLE: 'false'
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      # 8848 is the API and 9848 its derived gRPC port — the client protocol.
      # 8080 is the console, which 3.x serves separately.
      - '8848:8848'
      - '9848:9848'
      - '8080:8080'
    healthcheck:
      # The cluster self-node endpoint is the readiness signal that actually
      # answers 200 once the server is serving; the console moved off 8848 in
      # 3.x and the config endpoints reject an incomplete probe with a 4xx,
      # which `curl -f` would report as a failure rather than as "up".
      test: ['CMD-SHELL', 'curl -sf -H "serverIdentity: security" http://127.0.0.1:8848/nacos/v3/admin/core/cluster/node/self || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  dsh:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # The build context excludes .git; supply the commit the image is built
        # from so the client build metadata is honest.
        DSH_CLIENT_COMMIT_HASH: ${DSH_CLIENT_COMMIT_HASH:-0000000}
    depends_on:
      oceanbase:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      # Names this application. It is written into the `app` column that leads
      # every harness table's primary key, so several applications built on one
      # image share one database, one set of `dsh_` tables, and one Nacos server
      # without sharing a row. Changing it points the container at a different
      # set of rows — the old ones are left untouched, not migrated.
      DSH_APP_NAME: ${DSH_APP_NAME:-dsh}
      DSH_NACOS_HOST: nacos
      DSH_NACOS_PORT: '8848'
      DSH_NACOS_GROUP: DEFAULT_GROUP
      # Where the database is. The account it is reached with is NOT here: the
      # entrypoint reads `deployment.database.user` and `.password` from the
      # Nacos settings entry, so rotating the password is a Nacos edit and a
      # restart rather than a redeploy, and the secret stays out of the compose
      # file and out of `docker inspect`. A stack whose settings entry declares
      # no account falls back to these variables, and then to the plugin
      # defaults — which fail the connection loudly rather than serving.
      DSH_MYSQL_HOST: oceanbase
      DSH_MYSQL_PORT: '2881'
      DSH_MYSQL_DB: dsh
      # Space- or comma-separated package specs installed from the registry at
      # start. Changing this list changes the deployment's plugins without
      # rebuilding the image.
      DSH_PLUGINS: ${DSH_PLUGINS:-}
    ports:
      - '3080:3080'

volumes:
  obdata:
